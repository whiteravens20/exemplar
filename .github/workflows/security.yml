name: Security Monitoring

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions: {}

jobs:
  security-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update npm to 11+
        run: npm install -g npm@latest

      # Production dependencies ship in the image, so they are held to a tighter
      # bar (moderate). Development dependencies stay at high.
      #
      # audit-check.mjs wraps `npm audit` so that an advisory with no installable
      # fix and no reachable code path can be allowlisted on its own, with a
      # justification and an expiry, instead of lowering the threshold for every
      # package. See .github/scripts/audit-allowlist.json.
      - name: Audit production dependencies (moderate)
        run: node .github/scripts/audit-check.mjs --dir . --omit=dev --audit-level moderate

      - name: Audit all dependencies (high)
        run: node .github/scripts/audit-check.mjs --dir . --audit-level high

      # Verify that every installed tarball has a valid registry signature.
      # Catches forged tarballs and tampered registry metadata. Needs a fresh
      # install, because `audit signatures` reads node_modules.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify registry signatures
        run: npm audit signatures

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Any allowlisted ID goes here as `allow-ghsas:`, and its justification
          # in .github/scripts/audit-allowlist.json. Keep the two in sync.

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy on repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-docker:
    name: Trivy Docker image scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t exemplar:ci .

      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: exemplar:ci
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-docker.sarif
          trivyignores: .trivyignore
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: trivy-docker.sarif
          category: trivy-docker
